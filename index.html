<!DOCTYPE html>
<html lang="zh-CN" data-build="mobile">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f19ebe">
<link rel="manifest" href="manifest.webmanifest">
<title>我的记账本</title>
<style>
/* 马卡龙 · 少女风（默认主题）：薄荷绿 + 樱花粉 + 薰衣草紫 + 奶油黄，低饱和高明度 */
:root,[data-theme="macaron"]{
  --bg:#fdf8fb; --surface:#ffffff; --surface-2:#fdf1f7; --surface-3:#f8e6ef;
  --text:#5b4b54; --text-2:#927f89; --text-3:#bdaab5;
  --border:#f1e3eb; --border-2:#e7d0dc;
  --primary:#63c5a8; --primary-dark:#47a98c; --primary-soft:#e4f6ef;
  --accent:#f19ebe; --accent-soft:#fdeef4;
  --needs:#7ccfae; --wants:#f2a6c0; --savings:#b9a6e3; --debt:#efc98a;
  --danger:#ee8ba1; --danger-soft:#fdeef2; --success:#5fbfa0; --warning:#e0b265;
  --radius:18px; --radius-s:12px; --shadow:0 6px 20px rgba(200,150,180,.10);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  /* 交互控件统一变量：按钮、下拉框、输入框、标签页、胶囊按钮共用同一字体与尺寸体系 */
  --ctrl-fs:14px; --ctrl-h:40px; --ctrl-h-sm:34px;
}
[data-theme="fresh"]{
  --bg:#f5f8f6; --surface:#ffffff; --surface-2:#edf3ef; --surface-3:#dfe9e2;
  --text:#303a35; --text-2:#68756e; --text-3:#98a39c;
  --border:#dfe8e2; --border-2:#cbd8cf;
  --primary:#6f9c85; --primary-dark:#4f7c64; --primary-soft:#e4f0e9;
  --needs:#9ec4a4; --wants:#e8c79f; --savings:#a8bada; --debt:#c9b3b8;
  --danger:#c46b6b; --danger-soft:#f9eaea; --success:#5f9070; --warning:#bd944b;
}
[data-theme="warm"]{
  --bg:#faf6f1; --surface:#fffdfa; --surface-2:#f4ede3; --surface-3:#eae0d2;
  --text:#3d352f; --text-2:#7a6f66; --text-3:#a89e95;
  --border:#e9dfd2; --border-2:#d8cabb;
  --primary:#b08b70; --primary-dark:#8f6b51; --primary-soft:#f4e9de;
  --needs:#a9bd9b; --wants:#dfa98f; --savings:#b2a8c4; --debt:#c9b08c;
  --danger:#bd6a5f; --danger-soft:#f8e8e4; --success:#7b9a70; --warning:#bb8c46;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:var(--font);font-size:var(--ctrl-fs);font-weight:400;line-height:1.4;letter-spacing:0;color:inherit}
button{cursor:pointer}
.num,.value,.amount{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.app{max-width:1180px;margin:0 auto;padding:14px 14px 60px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--savings));color:#fff;display:grid;place-items:center;font-size:13px;font-weight:500;flex:none;box-shadow:0 4px 12px rgba(241,158,190,.35)}
.ledger-name{border:0;background:none;font-size:18px;font-weight:500;padding:4px 6px;border-radius:8px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ledger-name:hover{background:var(--surface-2)}
.hint{font-size:12px;color:var(--text-3)}
.spacer{flex:1}
.top-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],textarea{
  background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-s);padding:7px 10px;min-height:var(--ctrl-h);outline:none;max-width:100%
}
select:focus,input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea{width:100%;resize:vertical;min-height:64px}
.btn{border:1px solid var(--border-2);background:var(--surface);border-radius:var(--radius-s);padding:7px 13px;min-height:var(--ctrl-h);color:var(--text);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{min-height:var(--ctrl-h-sm);padding:4px 9px;font-size:var(--ctrl-fs);line-height:1.4;border-radius:var(--radius-s)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* 行内紧凑控件：与 .btn.sm 同高、同字号、同字族，保证与按钮并排时视觉统一 */
.inline-ctrl{min-height:var(--ctrl-h-sm);padding:4px 9px;font-size:var(--ctrl-fs);line-height:1.4;border-radius:var(--radius-s)}
select.inline-ctrl,input.inline-ctrl{width:auto}
input.num.inline-ctrl{text-align:right}
.nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.nav button{flex:0 0 auto;border:1px solid transparent;background:transparent;border-radius:999px;padding:7px 15px;min-height:var(--ctrl-h);color:var(--text-2);font-size:var(--ctrl-fs)}
.nav button:hover{background:var(--surface-2)}
.nav button.active{background:var(--primary-soft);color:var(--primary-dark);border-color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:15px;font-weight:500}
.card h4{margin:0 0 8px;font-size:14px;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:12px}
.stat{position:relative;overflow:hidden}
.stat:before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:18px 0 0 18px}
.stat.tone-in:before{background:var(--success)} .stat.tone-out:before{background:var(--accent)}
.stat.tone-save:before{background:var(--savings)} .stat.tone-left:before{background:var(--debt)}
.stat .label{font-size:13px;color:var(--text-2)}
.stat .value{font-size:27px;font-weight:600;margin:5px 0 2px;letter-spacing:-.4px}
.stat.tone-in .value{color:var(--success)}
.stat .sub{font-size:12px;color:var(--text-3)}
.stat.neg .value{color:var(--danger)}
.grid-2{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;margin-bottom:12px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.tight{gap:6px}
.col{flex:1;min-width:0}
.sep{height:1px;background:var(--border);margin:14px 0}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--border-2);background:var(--surface);border-radius:999px;padding:7px 13px;min-height:var(--ctrl-h);font-size:var(--ctrl-fs)}
.chip:hover{background:var(--surface-2)}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-dark)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.field{margin-bottom:12px}
.field label{display:block;font-size:var(--ctrl-fs);color:var(--text-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%}
/* 记账页主金额：参考清爽记账 App 的大号数字 + 薄荷绿下划线 */
input.amount-hero{font-size:34px!important;font-weight:600;line-height:1.25;color:var(--primary-dark);letter-spacing:-1px;border:0;border-bottom:2px solid var(--primary);border-radius:0;background:transparent;padding:4px 2px 8px;box-shadow:none!important}
input.amount-hero:focus{border-bottom-color:var(--accent);box-shadow:none!important}
input.amount-hero::placeholder{color:var(--text-3);font-weight:400}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 12px}
.list{display:grid;gap:8px}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-s);background:var(--surface)}
.list-item .grow{flex:1;min-width:0}
.list-item .title{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .meta{font-size:12px;color:var(--text-3)}
.amount.in{color:var(--success)}
.amount.out{color:var(--text)}
.amount.over{color:var(--danger)}
.empty{padding:26px 14px;text-align:center;color:var(--text-3);font-size:13px;border:1px dashed var(--border-2);border-radius:var(--radius-s)}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.badge.warn{background:var(--danger-soft);color:var(--danger)}
.badge.ok{background:var(--primary-soft);color:var(--primary-dark)}
details.help summary{cursor:pointer;font-size:13px;color:var(--primary-dark)}
details.help div{margin-top:10px;font-size:13px;color:var(--text-2);line-height:1.9}
details.fold>summary{cursor:pointer;font-size:14px;font-weight:500;color:var(--text-2);list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:before{content:'▸ ';color:var(--primary)}
details.fold[open]>summary:before{content:'▾ '}
details.fold[open]>summary{margin-bottom:12px}
.nav-more{padding-top:0}
.settings-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.calc-inline{display:none;margin-top:8px}
.calc-inline.open{display:block}
.calc-trigger{margin-left:8px;min-height:26px;padding:2px 8px;font-size:12px}
.mask{position:fixed;inset:0;background:rgba(40,40,35,.38);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);width:min(520px,100%);max-height:86vh;overflow:auto;padding:20px}
.modal h3{margin:0 0 8px;font-size:17px;font-weight:500}
.modal p{color:var(--text-2);font-size:14px;margin:0 0 14px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast-wrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:min(420px,calc(100% - 32px))}
.toast{background:var(--text);color:var(--surface);padding:10px 14px;border-radius:10px;font-size:13px;text-align:center}
.toast.error{background:var(--danger)}
.toast .toast-act{margin-left:12px;border:1px solid currentColor;border-radius:6px;background:transparent;color:inherit;padding:2px 8px;font-size:12px}
.field-error{color:var(--danger);font-size:12px;margin-top:4px}
#storage-badge{font-size:11px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:28px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:40}
.fab-menu{position:fixed;right:18px;bottom:calc(82px + env(safe-area-inset-bottom));display:none;grid-gap:6px;z-index:40;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px;box-shadow:var(--shadow)}
.fab-menu.open{display:grid}
.fab-menu button{min-width:96px;justify-self:end}
@media(max-width:760px){.fab{right:14px;bottom:calc(14px + env(safe-area-inset-bottom))}.fab-menu{right:14px;bottom:calc(78px + env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.calc{padding:10px;background:var(--surface-2);border-radius:var(--radius-s)}
.calc-display{font-family:var(--font);font-size:var(--ctrl-fs);font-variant-numeric:tabular-nums;text-align:right;min-height:30px;overflow:hidden;text-overflow:ellipsis}
.calc-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:6px}
.calc-keys button{min-height:var(--ctrl-h);border:1px solid var(--border);background:var(--surface);border-radius:7px;font-size:var(--ctrl-fs)}
.svgwrap{width:100%;overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--text-2);margin-top:6px}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:var(--ctrl-fs)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--text-2);font-weight:500}
td.num,th.num{text-align:right}
.section-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.section-head h3{margin:0}
.over-text{color:var(--danger);font-weight:500}
@media(max-width:760px){
  .app{padding:10px 10px 50px}
  .grid-2{grid-template-columns:1fr}
  .ledger-name{font-size:16px;max-width:150px}
  .stat .value{font-size:22px}
  .card{padding:13px}
  .modal{padding:16px}
  .top-controls select{max-width:44vw}
}
/* 触屏设备统一放大到 16px：避免 iOS Safari 聚焦输入框时自动缩放，同时保持控件间字号一致 */
@media (hover:none) and (pointer:coarse){
  :root{--ctrl-fs:16px;--ctrl-h:44px;--ctrl-h-sm:38px}
}

/* 发行包平台提示（可关闭，选择记忆在本地） */
.build-tip{display:none;align-items:center;gap:10px;margin:0 0 10px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-s);background:var(--primary-soft);color:var(--primary-dark);font-size:13px}
html[data-build="mobile"] .build-tip,html[data-build="desktop"] .build-tip{display:flex}
.build-tip .grow{flex:1;min-width:0}
.build-tip button{border:0;background:transparent;color:inherit;font-size:18px;line-height:1;padding:0 4px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">记账</div>
      <button class="ledger-name" data-action="rename-ledger" title="点击修改账本名">我的记账本</button>
    </div>
    <div class="spacer"></div>
    <div class="top-controls">
      <span class="badge" id="storage-badge" title="存储与同步状态">本地存储</span>
      <span class="badge" id="period-badge" title="当前周期日期范围">当前周期</span>
      <select id="period-select" data-change="period" aria-label="切换周期"></select>
      <select id="theme-select" data-change="theme" aria-label="切换主题">
        <option value="macaron">马卡龙</option><option value="fresh">清新</option><option value="warm">暖阳</option>
      </select>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="build-tip" id="build-tip"><span class="grow">手机版 · 点浏览器菜单「添加到主屏幕」即可全屏使用</span><button type="button" data-action="build-tip-close" aria-label="关闭提示">×</button></div>
  <main id="view"></main>
</div>
<button class="fab" data-action="fab-toggle" aria-label="快捷记一笔">＋</button>
<div class="fab-menu" id="fab-menu">
  <button class="btn sm" data-action="fab-new" data-type="expense">支出</button>
  <button class="btn sm" data-action="fab-new" data-type="income">收入</button>
  <button class="btn sm" data-action="fab-new" data-type="transfer">转账</button>
  <button class="btn sm" data-action="fab-template">模板一键记</button>
  <button class="btn sm" data-action="cmd-open">命令面板</button>
</div>
<div id="modal-root"></div>
<div class="toast-wrap" id="toast-root"></div>
<input type="file" id="file-input" accept="application/json,.json" hidden>
<script>
(function(){
'use strict';

const SCHEMA_VERSION = 1;
const KEY_DATA = 'ledger:data:v1';
const KEY_AUDIT = 'ledger:audit:v1';
const KEY_DRAFT = 'ledger:draft:v1';
const SECTIONS_INFO = {
  needs:{name:'必需',color:'var(--needs)'},
  wants:{name:'想要',color:'var(--wants)'},
  savings:{name:'储蓄投资',color:'var(--savings)'},
  debt:{name:'负债',color:'var(--debt)'}
};
const SECTION_KEYS = ['needs','wants','savings','debt'];
const RATIO_KEYS = ['needs','wants','savings'];
/* 流水类型：stat=是否计入收支统计，section=是否需要栏目/子项目，to=是否需要转入账户 */
const TX_TYPES = [
  {k:'expense',n:'支出',stat:true,section:true,dir:-1},
  {k:'income',n:'收入',stat:true,section:true,dir:1},
  {k:'transfer',n:'转账（不计入统计）',stat:false,section:false,to:true,dir:0},
  {k:'borrow_in',n:'借入（不计入统计）',stat:false,section:false,dir:1},
  {k:'lend_out',n:'借出（不计入统计）',stat:false,section:false,dir:-1},
  {k:'repay',n:'还款（不计入统计）',stat:false,section:false,dir:0},
  {k:'reimburse',n:'报销（计入支出）',stat:true,section:true,dir:-1}
];
const TX_LABEL = TX_TYPES.reduce((o,t)=>(o[t.k]=t.n,o),{});
const TX_INFO = TX_TYPES.reduce((o,t)=>(o[t.k]=t,o),{});
const ACCOUNT_TYPES = [['cash','现金'],['wechat','微信'],['alipay','支付宝'],['bank','银行卡'],['credit','信用卡'],['other','其他']];
const ACCOUNT_LABEL = ACCOUNT_TYPES.reduce((o,[k,n])=>(o[k]=n,o),{});

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const pad = n=>String(n).padStart(2,'0');
const now = ()=>new Date().toISOString();
const ymd = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hhmm = d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const uid = ()=>'i_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone = o=>JSON.parse(JSON.stringify(o));
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const money = n=>{if(typeof S!=='undefined'&&S&&S.meta&&S.meta.hideAmounts)return '••••';return (n<0?'-':'')+'¥'+Math.abs(num(n)).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});};
const daysInMonth = (y,m)=>new Date(y,m+1,0).getDate();
const effectivePayday = (y,m,d)=>Math.min(d,daysInMonth(y,m));
function stableStringify(v){
  if(v&&typeof v==='object'){
    if(Array.isArray(v)) return '['+v.map(stableStringify).join(',')+']';
    return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stableStringify(v[k])).join(',')+'}';
  }
  return JSON.stringify(v);
}
function fnv1a(str){
  let h=0x811c9dc5;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193);}
  return (h>>>0).toString(16).padStart(8,'0');
}
function checksum(data){
  return fnv1a(stableStringify({
    schemaVersion:data.schemaVersion,meta:data.meta,periods:data.periods,
    subItems:data.subItems,transactions:data.transactions,budgets:data.budgets
  }));
}
function auditFields(){
  const t=now();
  return {createdAt:t,updatedAt:t,deletedAt:null,version:1,deviceId:(S&&S.meta&&S.meta.deviceId)||'local',createdBy:'local',updatedBy:'local'};
}

const store={
  get(k){try{const s=localStorage.getItem(k);return s?JSON.parse(s):null;}catch(e){console.warn('读取失败',e);return null;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){toast('存储空间不足，请先导出备份','error');return false;}},
  del(k){try{localStorage.removeItem(k);}catch(e){}}
};

/* ===== 本地安全：账号密码/PIN 哈希、角色权限、7 天滚动登录、隐藏金额、完整性检查 ===== */
const LOGIN_KEY='ledger:auth:session:v1';
const LOGIN_TTL_MS=7*24*60*60*1000;
const LOGIN_TOUCH_MS=60*1000;
function pinAvailable(){return typeof crypto!=='undefined'&&!!(crypto.subtle&&crypto.subtle.importKey)&&typeof TextEncoder!=='undefined';}
function deriveSecret(secret,salt){
  if(!pinAvailable())return Promise.reject(new Error('当前环境不支持 WebCrypto 安全哈希，无法设置密码'));
  const enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(String(secret)),'PBKDF2',false,['deriveBits'])
    .then(key=>crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(String(salt)),iterations:100000,hash:'SHA-256'},key,256))
    .then(bits=>Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join(''));
}

function normalize(raw){
  const d=defaultState();
  const out=Object.assign({},d,raw);
  out.meta=Object.assign({},d.meta,(raw&&raw.meta)||{});
  out.meta.ratios=Object.assign({},d.meta.ratios,((raw&&raw.meta&&raw.meta.ratios)||{}));
  out.meta.customPeriod=Object.assign({},d.meta.customPeriod,((raw&&raw.meta&&raw.meta.customPeriod)||{}));
  out.meta.backupPolicy=Object.assign({},d.meta.backupPolicy,((raw&&raw.meta&&raw.meta.backupPolicy)||{}));
  out.meta.share=Object.assign({},d.meta.share,((raw&&raw.meta&&raw.meta.share)||{}));
  out.meta.privacy=Object.assign({},d.meta.privacy,((raw&&raw.meta&&raw.meta.privacy)||{}));
  out.meta.sync=Object.assign({},d.meta.sync,((raw&&raw.meta&&raw.meta.sync)||{}));
  if(!out.meta.currentUserId)out.meta.currentUserId='local-admin';
  /* 至少保留一名超级管理员：旧备份或误删后自动补回，不删除任何已有用户 */
  if(!out.users.some(u=>u.role==='superadmin'&&!u.deletedAt&&!u.disabled))
    out.users.push(Object.assign({id:'local-admin',name:'本地管理员',role:'superadmin',pinHash:'',pinSalt:'',disabled:false},auditFields()));
  out.sections.forEach(s=>{if(s.noRatio==null)s.noRatio=(s.id==='debt');});
  /* 账户字段增量兼容：旧备份只有渠道名称，自动补齐账户属性，不修改原数据 */
  out.channels.forEach(c=>{
    if(!c.type)c.type=/微信/.test(c.name)?'wechat':/支付宝/.test(c.name)?'alipay':/现金/.test(c.name)?'cash':/信用/.test(c.name)?'credit':'other';
    if(c.initialBalance==null)c.initialBalance=0;
    if(!Array.isArray(c.balanceAdjustments))c.balanceAdjustments=[];
    if(c.creditLimit==null)c.creditLimit=0;
    if(c.billDay==null)c.billDay=0;
    if(c.repayDay==null)c.repayDay=0;
  });
  COLLECTIONS.forEach(k=>{if(!Array.isArray(out[k])) out[k]=[];});
  if(!out.periods||typeof out.periods!=='object') out.periods={};
  out.schemaVersion=SCHEMA_VERSION;
  return out;
}
function migrate(raw){
  if(!raw||typeof raw!=='object') throw new Error('数据格式无效');
  const v=num(raw.schemaVersion||0);
  if(v>SCHEMA_VERSION) throw new Error('备份版本高于当前程序，已拒绝写入，原数据未被修改');
  if(v<SCHEMA_VERSION){
    store.set('ledger:backup:pre-migration:'+Date.now(),raw);
    store.set('ledger:data:legacy:'+Date.now(),raw);
  }
  const out=normalize(raw);
  if(v<SCHEMA_VERSION) out.__migratedFrom=v;
  return out;
}

function effectivePaydayOf(y,m){return effectivePayday(y,m,S.meta.paydayDay);}
function customCfg(){return S.meta.customPeriod||{unit:'month',interval:1,startDate:ymd(new Date()),day:1};}
function dayDiff(a,b){return Math.round((Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())-Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()))/86400000);}
function customStepDays(c){return c.unit==='week'?7:c.unit==='biweek'?14:0;}
function customPeriodStart(d){
  const c=customCfg(),anchor=new Date(String(c.startDate||ymd(new Date())).slice(0,10)+'T00:00:00');
  const day=Math.min(31,Math.max(1,num(c.day)||anchor.getDate()||1));
  if(c.unit==='week'||c.unit==='biweek'){
    const step=customStepDays(c)||7,n=Math.floor(dayDiff(d,anchor)/step);
    return new Date(anchor.getTime()+n*step*86400000);
  }
  if(c.unit==='year'){
    let y=d.getFullYear();const aM=anchor.getMonth(),aD=Math.min(day,daysInMonth(y,aM));
    if(d.getMonth()<aM||(d.getMonth()===aM&&d.getDate()<aD))y--;

  }
  let y=d.getFullYear(),m=d.getMonth();const eff=effectivePayday(y,m,day);
  if(d.getDate()<eff){m--;if(m<0){m=11;y-=1;}}
  return new Date(y,m,effectivePayday(y,m,day));
}
function customPeriodEnd(start){
  const c=customCfg();
  if(c.unit==='week'||c.unit==='biweek')return new Date(start.getTime()+(customStepDays(c)-1)*86400000);
  if(c.unit==='year')return new Date(start.getFullYear(),start.getMonth(),start.getDate()-1);
  return new Date(start.getFullYear(),start.getMonth()+1,0);
}
function periodKeyForDate(dateStr){
  const d=dateStr?new Date(String(dateStr).slice(0,10)+'T00:00:00'):new Date();
  if(S.meta.periodType==='custom')return `custom:${ymd(customPeriodStart(d))}`;
  const y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
  if(S.meta.periodType==='natural') return `natural:${y}-${pad(m+1)}-01`;
  const pd=effectivePaydayOf(y,m);
  let sy=y,sm=m;
  if(day<pd){sm=m-1;if(sm<0){sm=11;sy=y-1;}}
  return `payday:${sy}-${pad(sm+1)}-${pad(effectivePaydayOf(sy,sm))}`;

function periodRange(key){
  const parts=String(key).split(':');const type=parts[0];const start=new Date(parts[1]+'T00:00:00');
  if(type==='natural') return {start,end:new Date(start.getFullYear(),start.getMonth()+1,0)};
  if(type==='custom') return {start,end:customPeriodEnd(start)};
  const y=start.getFullYear(),m=start.getMonth();
  const nx=new Date(y,m+1,1);
  const endDay=effectivePaydayOf(nx.getFullYear(),nx.getMonth())-1;
  return {start,end:new Date(nx.getFullYear(),nx.getMonth(),endDay)};

function ensurePeriod(key){

      income:null,ratiosSnapshot:clone(S.meta.ratios),budgetTotal:0},auditFields());

function periodOptions(){
  const set=new Set();const base=new Date();
  if(S.meta.periodType==='custom'){
    const cur=customPeriodStart(base),c=customCfg();
    for(let i=0;i<12;i++){
      let d;
      if(c.unit==='week'||c.unit==='biweek')d=new Date(cur.getTime()-i*customStepDays(c)*86400000);
      else if(c.unit==='year')d=new Date(cur.getFullYear()-i,cur.getMonth(),cur.getDate());
      else d=new Date(cur.getFullYear(),cur.getMonth()-i,cur.getDate());
      set.add('custom:'+ymd(customPeriodStart(d)));
    }
  }else if(S.meta.periodType==='natural'){
    for(let i=0;i<12;i++){const d=new Date(base.getFullYear(),base.getMonth()-i,1);set.add(periodKeyForDate(ymd(d)));}
  }else{
    for(let i=0;i<14;i++){
      const d=new Date(base.getFullYear(),base.getMonth()-i,1);
      set.add(periodKeyForDate(ymd(new Date(d.getFullYear(),d.getMonth(),1))));
      set.add(periodKeyForDate(ymd(new Date(d.getFullYear(),d.getMonth(),effectivePaydayOf(d.getFullYear(),d.getMonth())))));
    }
  }

/* ===== 账户余额：由初始余额 + 校准差额 + 流水影响实时计算，流水变更/恢复自动反映 ===== */
function accountByName(name){return ordered(S.channels).find(c=>c.name===name)||null;}
function txAccountDelta(t,acc){
  const amt=num(t.amount);
  if(!acc)return 0;
  const isCredit=acc.type==='credit';
  switch(t.type){
    case 'expense': case 'reimburse': case 'lend_out': return -amt;
    case 'income': case 'borrow_in': return amt;
    case 'repay': return isCredit?amt:-amt;
    case 'transfer':
      if(t.account===acc.name&&t.toAccount===acc.name)return 0;
      if(t.account===acc.name)return -amt;
      if(t.toAccount===acc.name)return amt;
      return 0;
    default: return 0;
  }
}
function accountBalance(name){
  const acc=accountByName(name);
  if(!acc)return null;
  let bal=num(acc.initialBalance)+(acc.balanceAdjustments||[]).reduce((a,x)=>a+num(x.amount),0);
  S.transactions.forEach(t=>{if(!t.deletedAt)bal+=txAccountDelta(t,acc);});
  return Math.round(bal*100)/100;
}
function creditUsed(name){
  const acc=accountByName(name);
  if(!acc||acc.type!=='credit')return 0;
  return Math.max(0,Math.round(-num(accountBalance(name))*100)/100);
}
function creditAvailable(name){
  const acc=accountByName(name);
  if(!acc||acc.type!=='credit')return 0;
  return Math.max(0,Math.round((num(acc.creditLimit)-creditUsed(name))*100)/100);

function stats(key){
  const p=ensurePeriod(key);
  const inc=num(p.income);
  const txs=S.transactions.filter(t=>!t.deletedAt&&t.periodKey===key);
  const bySection={},keys=sectionKeys();
  keys.forEach(s=>bySection[s]={expense:0,income:0,count:0});
  txs.forEach(t=>{
    const info=TX_INFO[t.type];
    if(!info||!info.stat)return;
    const b=bySection[t.section]||bySection[keys[0]]||{expense:0,income:0,count:0};
    if(t.type==='expense'||t.type==='reimburse')b.expense+=num(t.amount);
    else if(t.type==='income')b.income+=num(t.amount);
    b.count++;
  });
  const sum=arr=>arr.reduce((a,t)=>a+num(t.amount),0);
  const expenseTx=txs.filter(t=>t.type==='expense'||t.type==='reimburse');
  const spent=sum(expenseTx);
  const savingsNet=bySection.savings.income-bySection.savings.expense;
  const debtRepaid=bySection.debt.expense;
  const rate=inc>0?savingsNet/inc*100:0;
  let allocated=0;keys.forEach(k=>allocated+=(k==='savings'?savingsNet:bySection[k].expense));
  const unallocated=inc-allocated;
  const ratios=p.ratiosSnapshot||S.meta.ratios;
  const targets={};
  ratioKeys().forEach(k=>targets[k]=inc*num(ratios[k])/100);

function backupDue(){
  const bp=S.meta.backupPolicy||{};
  if(!bp.auto)return false;
  const d=new Date(),last=bp.lastAutoAt?new Date(bp.lastAutoAt):null,mode=bp.mode||'interval';
  if(mode==='interval'){
    const days=Math.max(1,num(bp.intervalDays)||7);
    return !last||Date.now()-last.getTime()>=days*86400000;
  }
  if(mode==='weekly'){
    const target=Math.min(7,Math.max(1,num(bp.weekday)||1)),iso=d.getDay()===0?7:d.getDay();
    return iso===target&&(!last||ymd(last)!==ymd(d));
  }
  if(mode==='monthly'){
    const target=Math.min(31,Math.max(1,num(bp.monthDay)||1));
    const eff=Math.min(target,daysInMonth(d.getFullYear(),d.getMonth()));
    return d.getDate()===eff&&(!last||ymd(last)!==ymd(d));
  }
  if(mode==='date'){
    const md=String(bp.date||''),cur=pad(d.getMonth()+1)+'-'+pad(d.getDate());
    return md===cur&&(!last||last.getFullYear()!==d.getFullYear());
  }
  return false;
}
function checkBackupReminder(){
  const bp=S.meta.backupPolicy||{};
  if(!bp.remind)return;
  const snaps=S.backups.filter(b=>/备份/.test(b.reason||'')).map(b=>new Date(b.createdAt).getTime()).filter(t=>isFinite(t));
  const last=snaps.length?Math.max.apply(null,snaps):0;
  if(Date.now()-last<7*86400000)return;
  if(bp.lastRemindAt&&ymd(new Date(bp.lastRemindAt))===ymd(new Date()))return;
  bp.lastRemindAt=now();save();
  setTimeout(()=>toast('已超过 7 天未备份：建议到「数据管理」导出备份或立即创建快照',''),700);
}

function barChart(st){
  const vals=ratioKeys().map(k=>({k,target:st.targets[k]||0,actual:Math.max(0,(st.bySection[k]||{}).expense||0),name:sectionName(k),color:sectionColor(k)}));
  if(!vals.length)return '<div class="empty">暂无参与比例的栏目</div>';
  const max=Math.max(1,...vals.map(v=>Math.max(v.target,v.actual)));
  const H=138,base=176;
  const step=Math.min(150,430/vals.length),w=Math.max(14,Math.min(32,step*0.22));
  let bars='';
  vals.forEach((v,i)=>{
    const x=40+i*step;
    const th=Math.max(2,v.target/max*H),ah=Math.max(2,v.actual/max*H);
    bars+=`<rect x="${x}" y="${base-th}" width="${w}" height="${th}" rx="4" style="fill:var(--surface-3)" stroke="var(--border-2)" stroke-width="0.5"><title>应分配 ${money(v.target)}</title></rect>`;
    bars+=`<rect x="${x+w+5}" y="${base-ah}" width="${w}" height="${ah}" rx="4" style="fill:${v.color}"><title>实际 ${money(v.actual)}</title></rect>`;
    const cx=x+w+2;
    bars+=`<text x="${cx}" y="${202}" text-anchor="middle" font-size="12" style="fill:var(--text-2)">${esc(v.name)}</text>`;
    bars+=`<text x="${cx}" y="${220}" text-anchor="middle" font-size="11" style="fill:var(--text-3)">${money(v.actual)} / ${money(v.target)}</text>`;
  });
  return `<div class="svgwrap"><svg viewBox="0 0 500 232" width="100%" role="img" aria-label="栏目预算执行柱状图">
    <line x1="30" y1="${base+2}" x2="480" y2="${base+2}" stroke="var(--border-2)" stroke-width="1"/>
    ${bars}
    <rect x="350" y="12" width="10" height="10" rx="2" style="fill:var(--surface-3)" stroke="var(--border-2)" stroke-width="0.5"/>
    <text x="365" y="21" font-size="11" style="fill:var(--text-2)">应分配</text>
    <rect x="420" y="12" width="10" height="10" rx="2" style="fill:var(--primary)"/>
    <text x="435" y="21" font-size="11" style="fill:var(--text-2)">实际</text>
  </svg></div>`;
}
function pieChart(st){
  const vals=sectionKeys().map(k=>({k,name:sectionName(k),v:Math.max(0,(st.bySection[k]||{}).expense||0),color:sectionColor(k)}));
  const total=vals.reduce((a,x)=>a+x.v,0);
  if(total<=0) return '<div class="empty">当前周期还没有支出记录</div>';
  const r=66,c=2*Math.PI*r;let acc=0;
  const circles=vals.filter(x=>x.v>0).map(x=>{
    const frac=x.v/total,dash=frac*c,off=-acc*c;acc+=frac;
    return `<circle cx="110" cy="106" r="${r}" fill="none" style="stroke:${x.color}" stroke-width="32" stroke-dasharray="${dash.toFixed(2)} ${(c-dash).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 110 106)"><title>${esc(x.name)} ${money(x.v)}</title></circle>`;
  }).join('');
  const legend=vals.map(x=>`<span><i class="dot" style="background:${x.color}"></i>${esc(x.name)} ${money(x.v)}</span>`).join('');
  return `<div class="svgwrap"><svg viewBox="0 0 220 212" width="100%" role="img" aria-label="支出构成饼图">

    <text x="110" y="124" text-anchor="middle" font-size="16" style="fill:var(--text)">${esc(money(total))}</text>
  </svg></div><div class="legend">${legend}</div>`;
}

function categoryPieChart(byCat,label){

    .filter(x=>x.v>0).sort((a,b)=>b.v-a.v);

  const shown=vals.slice(0,10);

  const r=66,c=2*Math.PI*r;let acc=0;

  }).join('');
  const legend=shown.map((x,i)=>`<span><i class="dot" style="background:${PIE_PALETTE[i%PIE_PALETTE.length]}"></i>${esc(x.name)} ${money(x.v)} · ${(x.v/total*100).toFixed(1)}%</span>`).join('');
  return `<div class="svgwrap"><svg viewBox="0 0 220 212" width="100%" role="img" aria-label="分类支出饼图">

  </svg></div><div class="legend">${legend}</div>`;
}

/* ===== 周期账：到期生成待确认账单，确认后入账；不重复生成、不覆盖手工记录 ===== */
function recurringDueDates(r,today){
  const out=[];let cur=String(r.startDate||today).slice(0,10),guard=0;
  const from=r.lastGenerated?String(r.lastGenerated).slice(0,10):null;
  const stepDays=r.unit==='week'?7:r.unit==='biweek'?14:0;
  while(cur<=today&&guard++<80){
    if(!from||cur>from)out.push(cur);
    let d=new Date(cur+'T00:00:00');
    if(stepDays)d=new Date(d.getTime()+stepDays*86400000);
    else if(r.unit==='year')d=new Date(d.getFullYear()+1,d.getMonth(),d.getDate());
    else d=new Date(d.getFullYear(),d.getMonth()+1,Math.min(num(r.day)||1,daysInMonth(d.getFullYear(),d.getMonth()+1)));
    cur=ymd(d);
  }
  return out;
}
function generateRecurring(){
  const today=ymd(new Date());let added=0;
  S.recurringRules.forEach(r=>{
    if(r.deletedAt||r.enabled===false||!r.startDate)return;
    if(r.endDate&&today>r.endDate)return;
    const dues=recurringDueDates(r,today);
    dues.forEach(due=>{
      const key=periodKeyForDate(due);
      if(S.recurringInstances.some(i=>i.ruleId===r.id&&i.periodKey===key))return;
      S.recurringInstances.push(Object.assign({id:uid(),ruleId:r.id,periodKey:key,dueDate:due,
        amount:num(r.amount),status:'pending',txId:null},auditFields()));
      added++;
    });
    if(dues.length)r.lastGenerated=dues[dues.length-1];
  });
  if(added)audit('生成周期账单',added+' 条待确认');
  return added;
}
function confirmRecurring(id){
  const inst=S.recurringInstances.find(i=>i.id===id);
  if(!inst||inst.status!=='pending')return;
  const r=S.recurringRules.find(x=>x.id===inst.ruleId);if(!r)return;
  const tx=Object.assign({id:uid()},auditFields(),{
    type:r.type==='income'?'income':'expense',amount:num(inst.amount),date:inst.dueDate+'T09:00',
    section:r.section||'needs',subItemId:r.subItemId||null,account:r.account||'',toAccount:'',
    tags:'',note:r.name||'周期账单',periodKey:inst.periodKey,ledgerId:'local',source:'recurring',ruleId:r.id});
  S.transactions.push(tx);ensurePeriod(inst.periodKey);
  inst.status='confirmed';inst.txId=tx.id;inst.updatedAt=now();
  audit('确认周期账单',(r.name||'')+' '+money(inst.amount));
  save();render();toast('已确认入账');
}
function cancelRecurring(id){
  const inst=S.recurringInstances.find(i=>i.id===id);if(!inst)return;
  if(inst.status==='confirmed'&&inst.txId)softDelete('transactions',inst.txId);
  inst.status='cancelled';inst.updatedAt=now();
  audit('撤销周期账单',inst.dueDate);save();render();toast('已撤销，关联流水已移入回收站');
}

function reportMatches(t){
  const f=UI.report||{},date=String(t.date||'').slice(0,10);
  if(f.from&&date<f.from)return false;
  if(f.to&&date>f.to)return false;
  if(f.type&&t.type!==f.type)return false;
  if(f.section&&t.section!==f.section)return false;
  if(f.account&&t.account!==f.account)return false;
  if(f.tag&&String(t.tags||'').split(',').indexOf(f.tag)<0)return false;
  return true;
}
function reportData(){
  const txs=S.transactions.filter(t=>!t.deletedAt&&reportMatches(t));
  const isExp=t=>t.type==='expense'||t.type==='reimburse';
  const inc=txs.filter(t=>t.type==='income').reduce((a,t)=>a+num(t.amount),0);
  const exp=txs.filter(isExp).reduce((a,t)=>a+num(t.amount),0);
  const byCat={},byMonth={},byNote={};
  txs.filter(isExp).forEach(t=>{
    const name=t.subItemId?subName(t.subItemId):sectionName(t.section);
    byCat[name]=(byCat[name]||0)+num(t.amount);
    const nk=(t.note||'未备注').trim().slice(0,20);
    byNote[nk]=(byNote[nk]||0)+num(t.amount);
  });
  txs.forEach(t=>{
    const m=String(t.date||'').slice(0,7);
    if(!m)return;
    if(!byMonth[m])byMonth[m]={income:0,expense:0};
    if(t.type==='income')byMonth[m].income+=num(t.amount);
    else if(isExp(t))byMonth[m].expense+=num(t.amount);
  });
  return {txs,inc,exp,balance:inc-exp,byCat,byMonth,byNote};
}
function trendChart(byMonth){
  const keys=Object.keys(byMonth).sort().slice(-12);
  if(!keys.length)return '<div class="empty">当前筛选条件下暂无数据</div>';
  const max=Math.max(1,...keys.map(k=>Math.max(byMonth[k].income,byMonth[k].expense)));
  const W=620,H=220,L=48,R=16,T=18,B=34;
  const x=i=>L+i*(W-L-R)/Math.max(1,keys.length-1);
  const y=v=>H-B-(v/max)*(H-T-B);
  const path=f=>keys.map((k,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(byMonth[k][f]).toFixed(1)}`).join(' ');
  const grid=[0,.25,.5,.75,1].map(p=>{const yy=y(max*p);return `<line x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/><text x="${L-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="10" style="fill:var(--text-3)">${Math.round(max*p)}</text>`;}).join('');
  const labels=keys.map((k,i)=>`<text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10" style="fill:var(--text-3)">${esc(k.slice(2))}</text>`).join('');
  return `<div class="svgwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="收支趋势折线图">
    ${grid}<path d="${path('income')}" fill="none" stroke="var(--success)" stroke-width="2.5"/>
    <path d="${path('expense')}" fill="none" stroke="var(--danger)" stroke-width="2.5"/>
    ${keys.map((k,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(byMonth[k].income).toFixed(1)}" r="2.5" fill="var(--success)"/><circle cx="${x(i).toFixed(1)}" cy="${y(byMonth[k].expense).toFixed(1)}" r="2.5" fill="var(--danger)"/>`).join('')}
    ${labels}</svg></div><div class="legend"><span style="color:var(--success)">● 收入</span><span style="color:var(--danger)">● 支出</span></div>`;
}

function copyText(text,okMsg){
  const nav=typeof navigator!=='undefined'?navigator:null;
  const done=()=>toast(okMsg||'已复制到剪贴板');
  if(nav&&nav.clipboard&&typeof nav.clipboard.writeText==='function'){
    nav.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  }else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  try{
    const ta=document.createElement('textarea');ta.value=text;
    ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    document.execCommand('copy');ta.remove();done();
  }catch(e){toast('当前环境不支持自动复制，请手动选择文本','error');}
}

/* ===== 云同步：REST / WebDAV 适配器 + ETag 冲突检测 + 离线队列 ===== */
let syncTimer=null;
function syncCfg(){return S.meta.sync||{mode:'off',url:'',token:'',user:'',password:'',auto:false,intervalMin:15,deviceName:'',lastSyncAt:'',lastRemoteEtag:'',lastRemoteAt:'',lastResult:''};}
function syncModeName(){const m=syncCfg().mode;return m==='rest'?'REST 云同步':m==='webdav'?'WebDAV':m==='github'?'GitHub 私有仓库（免费）':'未启用';}
function syncEndpoint(){
  const u=String(syncCfg().url||'').trim().replace(/\/+$/,'');
  if(!u)return '';
  return /\/api\/sync$|\.json($|\?)/i.test(u)?u:(syncCfg().mode==='rest'?u+'/api/sync':u);
}
function syncHeaders(ifMatch){
  const c=syncCfg(),h={'Content-Type':'application/json','X-Device-Id':String(S.meta.deviceId||'local'),'X-Ledger-App':'personal-ledger'};
  if(ifMatch)h['If-Match']=String(ifMatch);
  if(c.mode==='webdav'){
    if(c.user){const raw=c.user+':'+(c.password||'');h.Authorization='Basic '+(typeof btoa==='function'?btoa(raw):Buffer.from(raw).toString('base64'));}
  }else if(c.token)h.Authorization='Bearer '+c.token;
  return h;
}
function syncRequest(method,body,ifMatch){
  if(typeof fetch!=='function')return Promise.reject(new Error('当前环境不支持网络同步，请使用现代浏览器'));
  const url=syncEndpoint();if(!url)return Promise.reject(new Error('请先填写同步服务地址'));
  return fetch(url,{method,headers:syncHeaders(ifMatch),body:body?JSON.stringify(body):undefined,cache:'no-store'}).then(async res=>{
    const h=res.headers&&typeof res.headers.get==='function'?res.headers:{get:()=>''};
    const text=res.text?await res.text():'';let payload=null;
    if(text){try{payload=JSON.parse(text);}catch(e){payload={raw:text};}}
    return {ok:res.ok,status:res.status,etag:h.get('etag')||'',payload};
  });
}
/* GitHub 私有仓库适配器：零服务器成本，HTTPS + sha 乐观并发。令牌只保存在本机。 */
function encodeBase64Utf8(text){
  const str=String(text==null?'':text);
  if(typeof TextEncoder==='function'&&typeof btoa==='function'){
    const bytes=new TextEncoder().encode(str);let bin='';
    for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
    return btoa(bin);
  }
  if(typeof Buffer!=='undefined')return Buffer.from(str,'utf8').toString('base64');
  return btoa(unescape(encodeURIComponent(str)));
}
function decodeBase64Utf8(text){
  const clean=String(text||'').replace(/\s+/g,'');
  if(typeof atob==='function'){
    const bin=atob(clean);
    if(typeof TextDecoder==='function'){
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }
    return decodeURIComponent(escape(bin));
  }
  if(typeof Buffer!=='undefined')return Buffer.from(clean,'base64').toString('utf8');
  throw new Error('当前浏览器不支持 Base64 解码');
}
function githubTarget(){
  const c=syncCfg(),owner=String(c.owner||'').trim(),repo=String(c.repo||'').trim();
  let file=String(c.path||'ledger/backup.json').trim().replace(/^\/+/,'');
  if(!file)file='ledger/backup.json';
  const path=file.split('/').filter(Boolean).map(s=>encodeURIComponent(s)).join('/');
  return {owner,repo,path,branch:String(c.branch||'main').trim()||'main',
    base:'https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo)+'/contents/'+path};
}
function githubRequest(method,body,ifMatch){
  if(typeof fetch!=='function')return Promise.reject(new Error('当前环境不支持网络同步，请使用现代浏览器'));
  const c=syncCfg(),t=githubTarget();
  if(!c.token)throw new Error('请填写 GitHub 访问令牌（仅存本机）');
  if(!t.owner||!t.repo)throw new Error('请填写 GitHub 用户名与私有仓库名');
  const isGet=method==='GET';
  const url=t.base+(isGet?'?ref='+encodeURIComponent(t.branch):'');
  const headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+c.token,'X-GitHub-Api-Version':'2026-03-10'};
  const opt={method,headers,cache:'no-store'};
  if(!isGet){
    headers['Content-Type']='application/json';
    const content=encodeBase64Utf8(JSON.stringify((body&&body.backup)||body));
    if(content.length>1024*1024)throw new Error('账本超过 GitHub Contents API 单文件 1MB 限制，请归档旧数据或改用 REST/WebDAV 通道');
    const payload={message:'记账本同步 '+now(),branch:t.branch,content};
    if(ifMatch)payload.sha=String(ifMatch).replace(/^"|"$/g,'');
    opt.body=JSON.stringify(payload);
  }
  return fetch(url,opt).then(async res=>{
    const h=res.headers&&typeof res.headers.get==='function'?res.headers:{get:()=>''};
    const text=res.text?await res.text():'';let payload=null;
    if(text){try{payload=JSON.parse(text);}catch(e){payload={raw:text};}}
    const etag=h.get('etag')||(payload&&payload.sha)||'';
    if(isGet&&res.ok&&payload&&payload.encoding==='base64'&&typeof payload.content==='string'){
      try{payload={__file:JSON.parse(decodeBase64Utf8(payload.content)),sha:payload.sha};}
      catch(e){payload={__file:null,sha:payload.sha,error:'云端文件解码失败：'+e.message};}
    }
    return {ok:res.ok,status:res.status,etag,payload};
  });
}
function requestSync(method,body,ifMatch){
  return syncCfg().mode==='github'?githubRequest(method,body,ifMatch):syncRequest(method,body,ifMatch);
}
function extractBackup(res){
  const p=res&&res.payload;if(!p)return null;
  if(p.__file&&p.__file.data&&p.__file.data.meta)return p.__file;
  if(p.__file&&p.__file.meta)return {checksum:p.__file.checksum||'',data:p.__file};
  if(p.backup&&p.backup.data&&p.backup.data.meta)return p.backup;
  if(p.data&&p.data.meta)return p;
  if(p.meta)return {checksum:p.checksum||'',data:p};
  return null;
}
function validateBackup(backup){
  const src=backup&&backup.data&&backup.data.meta?backup.data:backup;
  if(!src||!src.meta)throw new Error('云端数据格式不正确');
  const raw=backup&&backup.checksum?backup.checksum:(src.checksum||'');
  if(raw&&raw!==checksum(src))throw new Error('云端备份校验失败，已拒绝写入');
  return normalize(stripSecrets(clone(src)));
}
function queuePush(reason){
  const q=S.syncQueue||(S.syncQueue=[]),last=q[q.length-1];
  if(last&&last.action==='push'&&Date.now()-new Date(last.at||0).getTime()<10000){
    last.at=now();last.reason=reason;last.checksum=checksum(S);return;
  }
  q.push(Object.assign({id:uid(),action:'push',reason,at:now(),checksum:checksum(S)},auditFields()));
}
function syncPending(){return (S.syncQueue||[]).filter(x=>x.action==='push').length;}
function applyRemote(remote,cfg,reason,extra){
  snapshot(reason+'前自动备份');
  const backups=S.backups.slice(),logs=S.auditLogs.slice();
  const deviceId=S.meta.deviceId;
  const localGuard={pinEnabled:S.meta.pinEnabled,pinHash:S.meta.pinHash,pinSalt:S.meta.pinSalt,currentUserId:S.meta.currentUserId};
  const next=normalize(clone(remote));
  next.backups=backups;next.auditLogs=logs;
  next.meta.deviceId=deviceId;
  Object.assign(next.meta,localGuard);
  next.meta.sync=Object.assign({},next.meta.sync||{},cfg,extra||{},{lastSyncAt:now()});
  S=next;
  audit(reason,'来源 '+String(cfg.deviceName||cfg.url||'远程'));
  UI.periodKey=periodKeyForDate();ensurePeriod(UI.periodKey);
  document.documentElement.setAttribute('data-theme',S.meta.theme);
  save();render();
}
async function performPush(ifMatch){
  const backup=buildBackup(),res=await requestSync('PUT',{backup},ifMatch);
  if(res.status===409){showSyncConflict(res,'云端已有更新版本');return 'conflict';}
  if(!res.ok)throw new Error('上传失败（HTTP '+res.status+'）'+(res.payload&&res.payload.error?'：'+res.payload.error:''));
  const cfg=syncCfg();
  cfg.lastSyncAt=now();cfg.lastRemoteEtag=res.etag||cfg.lastRemoteEtag;
  cfg.lastRemoteAt=backup.exportedAt;cfg.lastResult='上传成功';
  S.meta.sync=cfg;S.syncQueue=[];
  audit('云同步上传','校验 '+backup.checksum);save();render();toast('已上传到云端');return 'ok';
}
function performPull(res){
  const backup=extractBackup(res);const remote=validateBackup(backup);
  const cfg=syncCfg(),extra={lastRemoteEtag:res.etag||cfg.lastRemoteEtag,
    lastRemoteAt:String((backup&&backup.exportedAt)||remote.meta.updatedAt||''),lastResult:'下载成功'};
  applyRemote(remote,cfg,'云同步下载',extra);toast('已下载云端账本（本机 PIN 与设备标识保留）');return 'ok';
}
function performMerge(res){
  const backup=extractBackup(res);const remote=validateBackup(backup);
  snapshot('云同步合并前自动备份');
  const rep=mergeImport(remote);
  Object.keys(remote.periods||{}).forEach(k=>{
    const l=S.periods[k],r=remote.periods[k];
    if(!l)S.periods[k]=clone(r);
    else if(String(r.updatedAt||'')>String(l.updatedAt||''))S.periods[k]=clone(r);
  });
  const cfg=syncCfg();
  cfg.lastSyncAt=now();cfg.lastRemoteEtag=res.etag||cfg.lastRemoteEtag;
  cfg.lastRemoteAt=String((backup&&backup.exportedAt)||remote.meta.updatedAt||'');cfg.lastResult='智能合并完成';
  S.meta.sync=cfg;
  audit('云同步智能合并','新增 '+rep.added+'，跳过 '+rep.skipped+'，冲突副本 '+rep.conflicts);
  save();render();toast('合并完成：新增 '+rep.added+' 条，冲突保留 '+rep.conflicts+' 条');return 'ok';
}
function showSyncConflict(res,why){
  const backup=extractBackup(res);let remote=null,remoteInfo='无法解析';
  try{remote=validateBackup(backup);remoteInfo=`账本「${esc(remote.meta.ledgerName||'未命名')}」· ${esc(String((backup&&backup.exportedAt)||remote.meta.updatedAt||'').replace('T',' ').slice(0,19))} · ${remote.transactions.filter(t=>!t.deletedAt).length} 笔流水`;}
  catch(e){remoteInfo=esc(e.message);}
  UI.syncConflict={res,remote};
  openModal(`<h3>同步冲突：${esc(why)}</h3>
    <p>本机与云端在上次同步后都发生了修改。请选择处理方式，系统不会静默覆盖任何一侧。</p>
    <div class="list" style="margin-bottom:12px">
      <div class="list-item"><div class="grow"><div class="title">本机版本</div><div class="meta">${esc(String(S.meta.updatedAt||'').replace('T',' ').slice(0,19))} · ${S.transactions.filter(t=>!t.deletedAt).length} 笔流水 · 校验 ${esc(checksum(S))}</div></div></div>
      <div class="list-item"><div class="grow"><div class="title">云端版本</div><div class="meta">${remoteInfo}</div></div></div>
    </div>
    <div class="actions" style="flex-wrap:wrap">
      <button class="btn" data-action="modal-cancel">取消</button>
      <button class="btn" data-action="sync-merge">智能合并（推荐）</button>
      <button class="btn" data-action="sync-use-local">上传覆盖云端</button>
      <button class="btn danger" data-action="sync-use-remote">下载覆盖本机</button>
    </div>`);
}
async function runSync(fn){
  if(UI.syncing){toast('正在同步中，请稍候');return;}
  if(syncCfg().mode==='off'){toast('请先在云同步页启用同步','error');return;}
  UI.syncing=true;render();
  try{return await fn();}
  catch(e){const c=syncCfg();c.lastResult='失败：'+e.message;S.meta.sync=c;save();toast(e.message,'error');return null;}
  finally{UI.syncing=false;render();}
}
function syncPush(){return runSync(()=>performPush(syncCfg().lastRemoteEtag||undefined));}
function syncPull(){return runSync(async()=>{
  const res=await requestSync('GET');
  if(res.status===404||!extractBackup(res)){toast('云端暂无数据，请先上传本机账本');return 'empty';}
  if(!res.ok)throw new Error('下载失败（HTTP '+res.status+'）');
  return performPull(res);
});}
function syncSmart(){return runSync(async()=>{
  const res=await requestSync('GET');
  if(res.status===404||!extractBackup(res))return performPush(undefined);
  if(!res.ok)throw new Error('同步失败（HTTP '+res.status+'）');
  const backup=extractBackup(res),remote=validateBackup(backup);
  const cfg=syncCfg();
  const localAt=String(S.meta.updatedAt||''),remoteAt=String((backup&&backup.exportedAt)||remote.meta.updatedAt||'');
  const localDirty=!!cfg.lastSyncAt&&localAt>cfg.lastSyncAt;
  const remoteDirty=!!cfg.lastRemoteAt&&remoteAt>cfg.lastRemoteAt;
  if(!localDirty&&!remoteDirty){cfg.lastResult='已是最新';S.meta.sync=cfg;save();toast('本机与云端已是最新');return 'latest';}
  if(remoteDirty&&localDirty){showSyncConflict(res,'双方都有新修改');return 'conflict';}
  if(remoteDirty)return performPull(res);
  return performPush(res.etag||cfg.lastRemoteEtag||undefined);
});}
function readSyncForm(){
  const c=syncCfg(),g=id=>{const el=$('#'+id);return el?el.value:null;};
  const mode=g('sync-mode');if(mode)c.mode=mode;
  const url=g('sync-url');if(url!==null)c.url=String(url).trim();
  const token=g('sync-token');if(token!==null&&String(token).trim())c.token=String(token).trim();
  const user=g('sync-user');if(user!==null)c.user=String(user).trim();
  const pass=g('sync-password');if(pass!==null&&String(pass))c.password=pass;
  const owner=g('sync-owner');if(owner!==null)c.owner=String(owner).trim();
  const repo=g('sync-repo');if(repo!==null)c.repo=String(repo).trim();
  const path=g('sync-path');if(path!==null)c.path=String(path).trim()||'ledger/backup.json';
  const branch=g('sync-branch');if(branch!==null)c.branch=String(branch).trim()||'main';
  const dev=g('sync-device');if(dev!==null)c.deviceName=String(dev).trim();
  const auto=$('#sync-auto');if(auto)c.auto=auto.value==='1';
  const itv=g('sync-interval');if(itv!==null)c.intervalMin=Math.max(1,num(itv));
  S.meta.sync=c;return c;
}
function setupAutoSync(){
  if(syncTimer){clearInterval(syncTimer);syncTimer=null;}
  const c=syncCfg();
  if(typeof window==='undefined')return;
  if(c.mode!=='off'&&c.auto&&c.intervalMin>0){
    syncTimer=setInterval(()=>{
      if(typeof navigator!=='undefined'&&navigator.onLine===false){const x=syncCfg();x.lastResult='离线，等待联网';S.meta.sync=x;save();return;}
      syncSmart();
    },Math.max(1,num(c.intervalMin))*60000);
  }
}

function tokenMasked(t){
  const s=String(t||'');
  if(!s)return '未配置';
  return s.length<=10?s.slice(0,3)+'****':s.slice(0,6)+'****'+s.slice(-4);
}
function tokenAgeDays(){
  const t=syncCfg().tokenUpdatedAt;
  if(!t)return null;
  const d=Math.floor((Date.now()-new Date(t).getTime())/86400000);
  return isNaN(d)?null:Math.max(0,d);
}

const KIND_LABEL={section:'栏目',sub:'子项目',channel:'支付渠道',tag:'标签'};
function kindColl(kind){return kind==='section'?'sections':kind==='sub'?'subItems':kind==='channel'?'channels':'tags';}
function kindItems(kind){return S[kindColl(kind)];}
function createEntity(kind,name,section,parentId){
  const parent=parentId?S.subItems.find(x=>x.id===parentId&&!x.deletedAt):null;
  const siblings=kind==='sub'?S.subItems.filter(x=>!x.deletedAt&&x.section===(parent?parent.section:(section||UI.section))&&(x.parentId||null)===(parentId||null)):ordered(kindItems(kind));
  const max=Math.max(0,...siblings.map(x=>num(x.order)));
  const base=Object.assign({id:uid(),name,order:max+1,archived:false},auditFields());
  if(kind==='section')Object.assign(base,{ratio:0,color:'var(--primary)',noRatio:true});
  if(kind==='sub')Object.assign(base,{section:parent?parent.section:(section||UI.section),parentId:parentId||null,budgetMode:'none',budgetAmount:0,type:'normal',totalAmount:0});
  if(kind==='channel'||kind==='tag')base.color='var(--primary)';
  kindItems(kind).push(base);
  audit('新增'+KIND_LABEL[kind],name);
  return base;
}
function quickAdd(kind,section,parentId){

    if(parentId&&!S.subItems.some(x=>x.id===parentId&&!x.deletedAt&&!x.parentId)){toast('二级项目必须挂在有效的一级项目下','error');return;}
    createEntity(kind,name,sec,parentId);save();render();toast((parent?'二级项目':KIND_LABEL[kind])+'已新增');

function quickDel(kind){
  if(kind==='tag'){
    const sel=$('#f-tag-add'),id=sel&&sel.value;
    if(!id){toast('请先选择要删除的标签','error');return;}
    const it=S.tags.find(x=>x.id===id);if(!it)return;
    confirmDialog({title:'删除标签',message:'「'+it.name+'」将移入回收站，历史流水中的标签文字保留。',onOk:()=>{
      captureForm();softDelete('tags',id);
      UI.form.tags=tagList().filter(t=>t!==it.name).join(',');
      audit('删除标签',it.name);save();render();
    }});return;
  }
  const sel=$('#f-'+(kind==='section'?'section':kind==='sub'?'sub':'account'));
  if(!sel)return;
  const val=sel.value;if(!val){toast('请先选择要删除的项目','error');return;}
  const it=kind==='channel'?ordered(S.channels).find(x=>x.name===val):kindItems(kind).find(x=>x.id===val);
  if(!it)return;
  if(kind==='section'){
    const used=S.subItems.some(x=>!x.deletedAt&&x.section===it.id)||S.transactions.some(t=>!t.deletedAt&&t.section===it.id);
    if(used){toast('该栏目已有子项目或流水，请先在「分类管理」中合并后再删除','error');return;}
  }
  confirmDialog({title:'删除'+KIND_LABEL[kind],message:'「'+it.name+'」将移入回收站，可随时恢复。',onOk:()=>{
    softDelete(kindColl(kind),it.id);audit('删除'+KIND_LABEL[kind],it.name);
    if(kind==='section'&&UI.section===it.id)UI.section=sectionKeys()[0]||'';
    if(kind==='sub'&&UI.subItemId===it.id)UI.subItemId='';
    save();render();
  }});

    <div class="actions"><button class="btn" data-action="modal-cancel">取消</button><button class="btn danger" data-action="merge-ok">确认合并</button></div>`);

function doMerge(kind,fromId,toId){
  if(fromId===toId)return;
  const from=kindItems(kind).find(x=>x.id===fromId),to=kindItems(kind).find(x=>x.id===toId);
  if(!from||!to)return;
  if(kind==='section'){
    S.transactions.forEach(t=>{if(t.section===fromId)t.section=toId;});
    S.subItems.forEach(x=>{if(x.section===fromId)x.section=toId;});
    const rf=num(S.meta.ratios[fromId]||0);
    if(rf&&!to.noRatio)S.meta.ratios[toId]=num(S.meta.ratios[toId]||0)+rf;
    S.meta.ratios[fromId]=0;
    Object.keys(S.periods).forEach(k=>{const r=S.periods[k].ratiosSnapshot;if(r){if(rf&&!to.noRatio)r[toId]=num(r[toId]||0)+rf;r[fromId]=0;}});
  }else if(kind==='sub'){
    S.transactions.forEach(t=>{if(t.subItemId===fromId)t.subItemId=toId;});
    S.budgets.forEach(b=>{
      if(b.subItemId!==fromId)return;
      if(S.budgets.some(x=>!x.deletedAt&&x.id!==b.id&&x.periodKey===b.periodKey&&x.subItemId===toId))b.deletedAt=now();
      else b.subItemId=toId;
    });
  }else if(kind==='channel'){
    S.transactions.forEach(t=>{if(t.account===from.name)t.account=to.name;});
  }else if(kind==='tag'){
    S.transactions.forEach(t=>{
      if(!t.tags)return;
      const arr=String(t.tags).split(',').map(s=>s.trim()).filter(Boolean).map(s=>s===from.name?to.name:s);
      t.tags=Array.from(new Set(arr)).join(',');
    });
  }
  softDelete(kindColl(kind),fromId);
  audit('合并'+KIND_LABEL[kind],from.name+' → '+to.name);
}
function computeCalc(){
  const expr=String(UI.calc||'').trim();
  if(!expr||!/^[0-9+\-*/(). ]+$/.test(expr)){toast('请输入有效算式（数字与 + - * / ( ) ）','error');return null;}
  try{
    const r=Function('"use strict";return ('+expr+')')();
    if(!isFinite(r))throw new Error('invalid');
    return Math.round(r*100)/100;
  }catch(e){toast('算式无效，请检查','error');return null;}
}
function fillCalcResult(){
  const r=computeCalc();if(r==null)return;
  captureForm();
  UI.calc=String(r);UI.calcOpen=false;UI.form=UI.form||{};UI.form.amount=String(r);
  render();
  const amt=$('#f-amount');if(amt)amt.value=String(r);
  toast('已将计算结果 '+r+' 填入金额');
}

function download(name,text,type){
  const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
/* 备份/云端文件默认脱敏：绝不把 PIN、同步令牌、WebDAV 密码写入可传输文件 */
function stripSecrets(src){
  const d=clone(src||{});
  if(d.meta){
    d.meta.pinEnabled=false;d.meta.pinHash='';d.meta.pinSalt='';
    d.meta.currentUserId='';
    if(d.meta.sync){
      d.meta.sync.mode='off';d.meta.sync.token='';d.meta.sync.password='';
      d.meta.sync.lastResult='';d.meta.sync.lastSyncAt='';d.meta.sync.lastRemoteEtag='';d.meta.sync.lastRemoteAt='';
    }
  }
  if(Array.isArray(d.users))d.users.forEach(u=>{u.pinHash='';u.pinSalt='';});
  return d;
}
function buildBackup(){
  const safe=stripSecrets(S);
  return {app:'personal-ledger',schemaVersion:SCHEMA_VERSION,exportedAt:now(),deviceId:S.meta.deviceId,
    ledgerName:S.meta.ledgerName,period:UI.periodKey,checksum:checksum(safe),data:safe};
}

function mergeImport(inc){
  const rep={added:0,skipped:0,conflicts:0};
  const keys=['sections','subItems','transactions','budgets','debts','tags','templates','recurringRules','transfers','auditLogs'];
  keys.forEach(k=>{
    if(!Array.isArray(inc[k]))return;
    inc[k].forEach(raw=>{
      const item=clone(raw);
      const exists=S[k].find(x=>x.id===item.id);
      if(!exists){S[k].push(item);rep.added++;return;}
      if(k==='sections'){rep.skipped++;return;}
      if(fnv1a(stableStringify(item))===fnv1a(stableStringify(exists))){rep.skipped++;return;}
      const cp=clone(item);cp.id=uid();cp.originalId=item.id;cp.createdAt=now();
      S[k].push(cp);rep.conflicts++;
    });
  });
  /* 账户按名称去重：流水按名称引用账户，保留本地账户名可避免历史流水失效 */
  if(Array.isArray(inc.channels))inc.channels.forEach(raw=>{
    const item=clone(raw);if(!item.name)return;
    if(S.channels.some(x=>x.name===item.name)){rep.skipped++;return;}
    S.channels.push(item);rep.added++;
  });
  Object.keys(inc.periods||{}).forEach(k=>{if(!S.periods[k]){S.periods[k]=clone(inc.periods[k]);rep.added++;}});
  return rep;
}
function importPreview(inc){
  const keys=['sections','subItems','channels','transactions','budgets','debts','tags','templates','recurringRules','recurringInstances','transfers','attachments'];
  let added=0,dup=0,conflict=0;const fields=[];
  keys.forEach(k=>{
    if(!Array.isArray(inc[k])||!inc[k].length)return;
    fields.push(k+' '+inc[k].length);
    const coll=S[k]||[];
    inc[k].forEach(item=>{
      const exists=coll.find(x=>x.id===item.id);
      if(!exists){added++;return;}
      if(fnv1a(stableStringify(item))===fnv1a(stableStringify(exists))){dup++;return;}
      conflict++;
    });
  });
  Object.keys(inc.periods||{}).forEach(k=>{if(S.periods[k])dup++;else added++;});
  return {added,dup,conflict,fields};
}
function handleImportFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let parsed;
    try{parsed=JSON.parse(reader.result);}catch(e){toast('文件不是有效的 JSON','error');return;}
    const src=parsed&&parsed.data&&parsed.data.meta?parsed.data:parsed;
    if(!src||!src.meta){toast('备份格式不正确','error');return;}
    const v=num(src.schemaVersion||0);
    if(v>SCHEMA_VERSION){toast('备份版本高于当前程序，未导入','error');return;}
    const rawChk=(parsed&&parsed.checksum)||src.checksum||'';
    const chk=rawChk?checksum(src):'';
    const inc=normalize(stripSecrets(src)),rep=importPreview(inc),isOver=UI.importMode==='overwrite';
    const chkState=!rawChk?'校验值缺失（按容错方式导入）'
      :(chk===rawChk?'校验通过':'⚠ 校验失败：文件可能被篡改，建议取消导入');
    const msg=`账本「${esc(src.meta.ledgerName||'未命名')}」 · schemaVersion ${v} · ${esc(src.exportedAt||'无导出时间')} · ${chkState}\n`
      +`数据量：${rep.fields.slice(0,8).join('、')||'无'}\n`
      +`重复检测：新增 ${rep.added}，重复跳过 ${rep.dup}，冲突保留副本 ${rep.conflict}。\n`
      +(isOver?'覆盖导入整体替换当前账本，但原数据先保存为快照，可随时回滚。':'合并导入不会删除任何原数据，导入前自动创建快照。');
    const doImport=()=>{
      snapshot('导入前自动备份');
      if(isOver){
        const backups=S.backups.slice(),logs=S.auditLogs.slice();
        S=inc;S.backups=backups;S.auditLogs=logs;
        audit('覆盖导入',`来源 ${src.meta.ledgerName||'未知'}`);
        UI.periodKey=periodKeyForDate();ensurePeriod(UI.periodKey);
        document.documentElement.setAttribute('data-theme',S.meta.theme);
        save();render();
        setTimeout(()=>infoDialog('覆盖导入完成','原数据已保存为快照，可在「数据管理 → 历史快照」中恢复。'),120);
      }else{
        const r=mergeImport(inc);
        audit('合并导入',`新增 ${r.added}，跳过 ${r.skipped}，冲突保留 ${r.conflicts}`);
        save();render();
        setTimeout(()=>infoDialog('导入完成',`新增 ${r.added} 条，重复跳过 ${r.skipped} 条，冲突保留 ${r.conflicts} 条。原数据完整保留。`),120);
      }
      UI.importMode=null;
    };
    confirmDialog({title:isOver?'覆盖导入（预览 + 二次确认）':'合并导入（预览 + 校验报告）',
      message:msg,requireText:isOver?S.meta.ledgerName:null,danger:isOver,onOk:doImport});
  };
  reader.readAsText(file,'utf-8');
}

function persistTx(keepForm){
  captureForm();
  const rawAmt=String(fval('amount')||'').trim(),amount=num(fval('amount'));
  const err=$('#amount-error');if(err){err.hidden=true;err.textContent='';}
  const invalid=msg=>{if(err){err.textContent=msg;err.hidden=false;}toast(msg,'error');};
  if(!rawAmt||amount<=0){invalid('金额必须大于 0，请就地修改');return;}
  if(!isFinite(amount)||amount>1000000000){invalid('金额超出有效范围（上限 10 亿）');return;}
  if(/^\d+\.\d{3,}$/.test(rawAmt)){invalid('金额最多保留两位小数');return;}
  const type=UI.type;
  const date=fval('date')||`${ymd(new Date())}T${hhmm(new Date())}`;
  const key=periodKeyForDate(date);ensurePeriod(key);
  const info=TX_INFO[type]||{};
  if(info.to&&fval('toAccount')===fval('account')){toast('转入账户不能与转出账户相同','error');return;}
  const old=UI.editingId?S.transactions.find(t=>t.id===UI.editingId):null;
  let savedId=old?old.id:null;
  const base=old||auditFields();
  const data={type,amount,date,section:info.section===false?type:UI.section,
    subItemId:info.section===false?null:(UI.subItemId||null),account:fval('account'),
    toAccount:info.to?fval('toAccount'):'',
    tags:fval('tags'),note:fval('note'),periodKey:key,ledgerId:'local'};
  if(old){Object.assign(old,data,{updatedAt:now(),updatedBy:'local',version:(old.version||1)+1});audit('编辑流水',txTypeLabel(type)+' '+money(amount));}
  else{const tx=Object.assign({id:uid()},base,data);savedId=tx.id;S.transactions.push(tx);audit('新增流水',txTypeLabel(type)+' '+money(amount));}
  UI.lastTx=clone(data);
  UI.editingId=null;
  if(keepForm){UI.form=UI.form||{};UI.form.amount='';UI.form.note='';}
  else{UI.form={};UI.calc='';UI.calcOpen=false;}
  UI.subItemId='';
  store.del(KEY_DRAFT);
  save();render();
  toast(old?'已保存修改':'已记一笔','',{label:'撤销',duration:5000,onClick:()=>{
    softDelete('transactions',savedId);audit('撤销保存','流水 '+savedId+' 移入回收站');save();render();toast('已撤销，流水移入回收站');
  }});
}
/* 隐私：离开页面或闲置达到阈值后自动锁定；同时维护 7 天滚动登录会话 */
let autoLockTimer=null,lastActivity=Date.now(),autoLockBound=false,sessionWatchTimer=null;
function noteActivity(){
  lastActivity=Date.now();
  if(UI.loggedIn)touchAuthSession();
}
function setupSessionWatch(){
  if(sessionWatchTimer)clearInterval(sessionWatchTimer);
  sessionWatchTimer=setInterval(()=>{
    if(!UI.loggedIn)return;
    if(!authSession())forceLogin('登录已超过 7 天未使用，请重新验证身份');
  },60000);
  if(sessionWatchTimer&&typeof sessionWatchTimer.unref==='function')sessionWatchTimer.unref();
}
function setupAutoLock(){
  if(autoLockTimer){clearInterval(autoLockTimer);autoLockTimer=null;}
  if(typeof window!=='undefined'&&window.addEventListener&&!autoLockBound){
    autoLockBound=true;
    window.addEventListener('mousemove',noteActivity,{passive:true});
    window.addEventListener('keydown',noteActivity);
    window.addEventListener('touchstart',noteActivity,{passive:true});
    if(typeof document!=='undefined'&&document.addEventListener)document.addEventListener('visibilitychange',()=>{
      if(document.hidden===true)tryAutoLock(true);
      else noteActivity();
    });
  }
  const min=num(S.meta.privacy&&S.meta.privacy.autoLockMin);
  if(!min||!S.meta.pinEnabled)return;
  autoLockTimer=setInterval(()=>tryAutoLock(false),Math.max(10,Math.min(60,min*60/3))*1000);
}
function tryAutoLock(leaving){
  const min=num(S.meta.privacy&&S.meta.privacy.autoLockMin);
  if(!min||!S.meta.pinEnabled||!UI.unlocked)return;
  const idleMs=(Date.now()-lastActivity)/60000;
  if(leaving||idleMs>=min){
    UI.unlocked=false;UI.loggedIn=false;captureForm();showLock();
    if(autoLockTimer){clearInterval(autoLockTimer);autoLockTimer=null;}
  }
}
function init(){
  const raw=store.get(KEY_DATA);
  if(raw){
    try{S=migrate(raw);}catch(e){S=defaultState();setTimeout(()=>toast(e.message+'；当前显示空白账本，原数据未被修改','error'),300);}
  }else{S=defaultState();}
  UI.periodKey=periodKeyForDate();ensurePeriod(UI.periodKey);
  if(typeof location!=='undefined'&&location.search){
    try{
      const q=new URLSearchParams(location.search).get('quick');
      if(q==='budget')UI.view='budget';
      else if(q==='expense'||q==='income'){UI.view='entry';UI.type=q;}
    }catch(e){}
  }
  let dirty=generateRecurring();
  if(backupDue()){
    const bp=S.meta.backupPolicy;
    snapshot('定时自动备份');bp.lastAutoAt=now();audit('定时自动备份',backupPolicyLabel());dirty=true;
  }
  if(dirty)save();
  UI.loggedIn=false;
  const session=authSession();
  if(session&&S.users.some(u=>u.id===session.userId&&!u.deletedAt&&!u.disabled)){
    S.meta.currentUserId=session.userId;
    UI.loggedIn=true;
    touchAuthSession(true);
  }
  UI.unlocked=UI.loggedIn;
  document.documentElement.setAttribute('data-theme',S.meta.theme);
  document.title=S.meta.ledgerName;
  bindEvents();render();setupAutoSync();setupAutoLock();setupSessionWatch();checkBackupReminder();
  if(typeof window!=='undefined'&&window.addEventListener){
    window.addEventListener('online',()=>{if(syncCfg().mode!=='off'&&syncCfg().auto)syncSmart();});
  }
  if(!UI.loggedIn)showLoginDialog();
  if(typeof navigator!=='undefined'&&navigator.serviceWorker&&typeof location!=='undefined'&&/^https?:/.test(location.protocol)){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
}

      if(sec.noRatio)S.meta.ratios[id]=0;
      else if(S.meta.ratios[id]==null)S.meta.ratios[id]=0;
      audit('切换栏目比例',sec.name+(sec.noRatio?' 不参与比例':' 参与比例'));save();render();
      if(sec.noRatio&&had>0)toast('该栏目已退出比例，请到预算设置重新分配至 100%');return;
    }
    if(a==='mg-del'){
      const kind=el.dataset.kind,item=kindItems(kind).find(x=>x.id===id);if(!item)return;
      if(kind==='section'){
        const used=S.subItems.some(x=>!x.deletedAt&&x.section===id)||S.transactions.some(t=>!t.deletedAt&&t.section===id);
        if(used){toast('该栏目已有项目或流水，请先使用「合并」迁移数据','error');return;}
      }
      const children=kind==='sub'?S.subItems.filter(x=>!x.deletedAt&&x.parentId===id):[];
      const msg=children.length?`「${item.name}」将移入回收站；其下 ${children.length} 个二级项目会自动升为一级项目，历史流水不受影响。`:`「${item.name}」将移入回收站，可恢复。`;
      confirmDialog({title:'删除'+KIND_LABEL[kind],message:msg,onOk:()=>{
        if(children.length)children.forEach(c=>{c.parentId=null;c.updatedAt=now();});
        softDelete(kindColl(kind),id);audit('删除'+KIND_LABEL[kind],item.name+(children.length?'（'+children.length+' 个二级项目升为一级）':''));
        if(kind==='section'&&UI.section===id)UI.section=sectionKeys()[0]||'';
        save();render();
      }});return;
    }
    if(a==='confirm-ok'){
      const o=UI.confirm;if(!o)return;
      if(o.requireText&&$('#confirm-text').value.trim()!==o.requireText){toast('确认文本不正确','error');return;}
      closeModal();o.onOk();return;
    }
    if(a==='prompt-ok'){
      const o=UI.prompt;if(!o)return;
      const v=$('#prompt-input').value;closeModal();o.onOk(v);return;
    }
    if(a==='modal-cancel'){closeModal();return;}
  });
  document.addEventListener('contextmenu',function(e){
    const el=e.target&&e.target.closest?e.target.closest('[data-tx-id]'):null;
    if(!el)return;
    e.preventDefault();UI.contextId=el.dataset.txId;
    const t=S.transactions.find(x=>x.id===UI.contextId);if(!t)return;
    openModal(`<h3>流水快捷操作</h3><p>${esc(String(t.date||'').replace('T',' '))} · ${esc(txTypeLabel(t.type))} · ${esc(money(t.amount))} · ${esc(t.note||'无备注')}</p>
      <div class="actions" style="flex-wrap:wrap"><button class="btn" data-action="modal-cancel">取消</button>
      <button class="btn" data-action="ctx-copy">复制这笔</button>
      <button class="btn" data-action="ctx-edit">编辑</button>
      <button class="btn danger" data-action="ctx-del">删除到回收站</button></div>`);
  });
  document.addEventListener('change',function(e){
    const el=e.target;const a=el.dataset&&el.dataset.change;if(!a)return;
    const id=el.dataset.id;
    if(a==='section'){captureForm();UI.section=el.value;UI.subItemId='';render();return;}
    if(a==='sub'){captureForm();UI.subItemId=el.value;render();return;}
    if(a==='channel'){captureForm();UI.form.account=el.value;render();return;}
    if(a==='period'){captureForm();UI.periodKey=el.value;ensurePeriod(UI.periodKey);save();render();return;}
    if(a==='theme'){S.meta.theme=el.value;document.documentElement.setAttribute('data-theme',el.value);save();render();return;}
    if(a==='sync-mode'){readSyncForm();save();render();return;}
    if(a==='ledger-name'){
      const name=String(el.value||'').trim();if(!name){toast('账本名不能为空','error');render();return;}
      S.meta.ledgerName=name;save();render();return;
    }
    if(a==='income'){
      const p=ensurePeriod(UI.periodKey);
      p.income=el.value===''?null:num(el.value);p.updatedAt=now();
      save();render();return;
    }
    if(a==='auto-lock'){
      S.meta.privacy.autoLockMin=Math.max(0,num(el.value));
      audit('修改自动锁定',S.meta.privacy.autoLockMin+' 分钟');save();render();setupAutoLock();return;
    }
    if(a==='share-hide-default'){S.meta.share.hideAmounts=el.value==='1';audit('修改分享默认金额显示',S.meta.share.hideAmounts?'隐藏':'显示');save();render();return;}
    if(a==='share-note-default'){S.meta.share.includeNote=el.value==='1';audit('修改分享默认备注',S.meta.share.includeNote?'包含':'不含');save();render();return;}
    if(a==='current-user'){
      const u=S.users.find(x=>x.id===el.value&&!x.deletedAt&&!x.disabled);
      if(!u||u.id===S.meta.currentUserId){render();return;}
      if(!userHasPassword(u)){toast('该用户尚未设置登录密码，请先由管理员重置','error');render();return;}
      UI.loginSwitchId=u.id;showLoginDialog('switch','切换到 '+u.name+' 需验证其登录密码');return;
    }
    if(a==='payday'){
      S.meta.paydayDay=num(el.value);UI.periodKey=periodKeyForDate();ensurePeriod(UI.periodKey);
      audit('修改发薪日',String(S.meta.paydayDay));save();render();return;
    }
    if(a==='report'){
      UI.report=UI.report||{};UI.report[id]=el.value;render();return;
    }
    if(a==='backup-auto'||a==='backup-mode'||a==='backup-interval'||a==='backup-weekday'||a==='backup-monthday'||a==='backup-date'||a==='backup-remind'||a==='backup-keep'){
      const bp=S.meta.backupPolicy;
      if(a==='backup-auto')bp.auto=el.value==='1';
      if(a==='backup-mode')bp.mode=el.value;
      if(a==='backup-interval')bp.intervalDays=Math.max(1,num(el.value));
      if(a==='backup-weekday')bp.weekday=Math.min(7,Math.max(1,num(el.value)));
      if(a==='backup-monthday')bp.monthDay=Math.min(31,Math.max(1,num(el.value)));
      if(a==='backup-date')bp.date=/^\d{2}-\d{2}$/.test(el.value)?el.value:'01-01';
      if(a==='backup-remind')bp.remind=el.value==='1';
      if(a==='backup-keep')bp.keepMax=Math.max(0,num(el.value));
      audit('修改备份策略',backupPolicyLabel());save();render();
      if(bp.keepMax>0)toast('当前 '+S.backups.length+' 份备份；保留上限仅作提醒，绝不自动删除历史备份');
      return;
    }
    if(a==='custom-unit'||a==='custom-start'||a==='custom-day'){
      const c=customCfg();
      if(a==='custom-unit')c.unit=el.value;
      if(a==='custom-start')c.startDate=el.value;
      if(a==='custom-day')c.day=Math.min(31,Math.max(1,num(el.value)));
      S.meta.customPeriod=c;UI.periodKey=periodKeyForDate();ensurePeriod(UI.periodKey);
      audit('修改自定义周期',JSON.stringify(c));save();render();return;
    }
    if(a==='ratio'){
      const v=num(el.value);if(v<0||v>100){toast('比例需在 0 到 100 之间','error');render();return;}
      const next=clone(S.meta.ratios);next[id]=v;
      const sum=ratioKeys().reduce((t,k)=>t+num(next[k]),0);
      if(Math.abs(sum-100)>0.001){toast('参与比例的栏目合计必须等于 100%，当前 '+sum+'%','error');render();return;}
      S.meta.ratios=next;const p=ensurePeriod(UI.periodKey);p.ratiosSnapshot=clone(next);p.updatedAt=now();
      audit('修改比例',JSON.stringify(next));save();render();toast('比例已更新，预算已重算');return;
    }
    if(a==='budget-mode'){
      const it=S.subItems.find(x=>x.id===id);if(!it)return;
      it.budgetMode=el.value;it.updatedAt=now();save();render();return;
    }
    if(a==='budget-amount'){
      const it=S.subItems.find(x=>x.id===id);if(!it)return;
      const amt=num(el.value);
      setBudget(UI.periodKey,id,amt);
      it.budgetAmount=amt;it.updatedAt=now();
      audit('设置子项目预算',sectionName(it.section)+'/'+it.name+' '+money(amt));
      save();render();return;
    }
  });
  document.addEventListener('input',function(e){
    if(e.target&&e.target.id==='calc-input')UI.calc=e.target.value;
    if(e.target&&e.target.id==='cmd-input'){
      const kw=String(e.target.value||'').trim().toLowerCase(),box=$('#cmd-results');
      if(box&&UI.commands){
        box.innerHTML=UI.commands.map((c,i)=>c).filter(c=>!kw||c[0].toLowerCase().includes(kw))
          .map(c=>`<button class="list-item" style="width:100%;text-align:left" data-action="cmd-run" data-index="${UI.commands.indexOf(c)}"><div class="grow"><div class="title">${esc(c[0])}</div></div></button>`).join('')||'<div class="empty">没有匹配的命令</div>';
      }
    }
    if(e.target&&e.target.id==='f-amount'){
      const er=$('#amount-error');if(er){er.hidden=true;er.textContent='';}
      const raw=String(e.target.value||'');
      if(!UI.calcOpen&&/[+\-*/()]/.test(raw)){
        captureForm();UI.calc=raw;UI.calcOpen=true;render();
        const ci=$('#calc-input');if(ci){if(ci.focus)ci.focus();if(ci.setSelectionRange)ci.setSelectionRange(raw.length,raw.length);}
      }else if(UI.calcOpen)UI.calc=raw;
    }
  });
  document.addEventListener('keydown',function(e){
    const t=e.target||{},tag=String(t.tagName||'').toLowerCase(),mod=e.ctrlKey||e.metaKey;
    const hasModal=!!$('#modal-root').innerHTML;
    if(e.key==='Escape'){
      if(hasModal){closeModal();e.preventDefault();return;}
      if(UI.fabOpen){UI.fabOpen=false;const m=$('#fab-menu');if(m&&m.classList)m.classList.remove('open');e.preventDefault();return;}
    }
    if(mod&&String(e.key||'').toLowerCase()==='k'){e.preventDefault();if(can('cmd-open'))commandDialog();return;}
    if(!mod&&!e.altKey&&String(e.key||'').toLowerCase()==='n'&&!['input','textarea','select'].includes(tag)&&!hasModal){
      if(can('fab-new')){e.preventDefault();captureForm();UI.view='entry';UI.type='expense';render();const a=$('#f-amount');if(a&&a.focus)a.focus();}
      return;
    }
    if(t.id==='f-amount'&&!UI.calcOpen&&['+','-','*','/','(',')'].indexOf(String(e.key||''))>=0){
      e.preventDefault();captureForm();UI.calc=String(t.value||'')+e.key;UI.calcOpen=true;render();
      const ci=$('#calc-input');if(ci){if(ci.focus)ci.focus();if(ci.setSelectionRange)ci.setSelectionRange(UI.calc.length,UI.calc.length);}
      return;
    }
    if(e.key!=='Enter'||!t)return;
    if(t.id==='cmd-input'){
      e.preventDefault();const kw=String(t.value||'').trim().toLowerCase();
      const hit=(UI.commands||[]).find(c=>c[0].toLowerCase().includes(kw));
      if(hit)runCommand(hit);return;
    }
    if(t.id==='calc-input'){e.preventDefault();fillCalcResult();return;}
    if(t.id==='f-amount'){
      const v=String(t.value||'').trim();
      if(/[+\-*/()]/.test(v)){e.preventDefault();UI.calc=v;fillCalcResult();}
      else t.blur();
      return;
    }
    if(UI.view==='entry'&&['input','textarea','select'].indexOf(tag)>=0&&can(mod?'save-tx-continue':'save-tx')){
      e.preventDefault();if(mod)persistTx(true);else persistTx(false);return;
    }
  });
  $('#file-input').addEventListener('change',function(e){
    const f=e.target.files&&e.target.files[0];if(f)handleImportFile(f);
  });
}

init();
})();
</script>

<script>
(function(){
  try{
    var build=document.documentElement.getAttribute('data-build')||'desktop';
    var tip=document.getElementById('build-tip');
    if(tip&&localStorage.getItem('ledger:build-tip:'+build)==='hidden') tip.style.display='none';
    document.addEventListener('click',function(e){
      var t=e.target&&e.target.closest&&e.target.closest('[data-action="build-tip-close"]');
      if(t&&tip){tip.style.display='none';try{localStorage.setItem('ledger:build-tip:'+build,'hidden');}catch(_){}}
    });
    console.log('记账本发行版：'+build);
  }catch(_){}
})();
</script>
